resources:
  jobs:
    forecasting_pipeline:
      name: ${bundle.name}-${bundle.target}
      tags:
        project: forecasting-mlops
        environment: ${bundle.target}
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: bootstrap_synthetic_input
          environment_key: default
          spark_python_task:
            python_file: ../scripts/bootstrap_synthetic_data.py
            parameters:
              - --root-path
              - ${workspace.root_path}
              - --env
              - ${bundle.target}
              - --as-of-date
              - ${var.as_of_date}
        - task_key: train_and_forecast
          environment_key: default
          depends_on:
            - task_key: bootstrap_synthetic_input
          spark_python_task:
            python_file: ../scripts/run_forecasting.py
            parameters:
              - --root-path
              - ${workspace.root_path}
              - --env
              - ${bundle.target}
              - --as-of-date
              - ${var.as_of_date}
              - --run-id
              - "{{job.run_id}}"
